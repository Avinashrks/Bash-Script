<!--Html code to accept two values in static site and save to S3 through lambda -->

<!DOCTYPE html>
<html>
<head>
    <title>Submit Data</title>
</head>
<body>
    <h1>Enter Details</h1>
    <form id="dataForm">
        <input type="text" id="value1" placeholder="Enter Value 1" required>
        <input type="text" id="value2" placeholder="Enter Value 2" required>
        <button type="submit">Submit</button>
    </form>
    <p id="response"></p>

    <script>
        document.getElementById('dataForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const value1 = document.getElementById('value1').value;
            const value2 = document.getElementById('value2').value;

            try {
                const response = await fetch('https://bwac810wx3.execute-api.ap-south-1.amazonaws.com/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value1, value2 })
                });

                const result = await response.json();
                document.getElementById('response').innerText = result.message || 'Data submitted!';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('response').innerText = 'Submission failed!';
            }
        });
    </script>
</body>
</html>
